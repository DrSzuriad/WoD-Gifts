<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="Fetishes and Talens">
        Fetishes and Talens
    </title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"
    >

    <link rel="stylesheet" href="css/main.css?v=1.0.5">
    <link rel="stylesheet" href="css/fetishes.css?v=1.0.5">
</head>

<body>

<header class="site-header">

    <h1 data-i18n="Fetishes and Talens">
        Fetishes and Talens
    </h1>

    <div class="top-bar">

        <div class="app-version">
            <span data-i18n="Version">Version</span>:
            <span data-app-version>v1.0.5</span>
        </div>

        <div class="language-switch">

            <label for="languageSelect">
                <span data-i18n="Language">Language</span>:
            </label>

            <select id="languageSelect">
                <option value="en" data-i18n="English">
                    English
                </option>

                <option value="pl" data-i18n="Polski">
                    Polski
                </option>
            </select>

        </div>

    </div>

    <nav class="main-nav">
        <a
            href="./index.html"
            data-i18n="Gifts">
            Gifts
        </a>

        <a
            class="active"
            href="./fetishes.html"
            aria-current="page"
            data-i18n="Fetishes and Talens">
            Fetishes and Talens
        </a>
    </nav>

</header>

<main id="fetishesContent">
    <div class="filters">
        <select id="fetishTypeSelect" multiple></select>
        <select id="fetishLevelSelect" multiple></select>
        <select id="fetishGnosisSelect" multiple></select>

        <div
            id="requirementFilters"
            class="requirement-filters">
            <select id="requirementTypeSelect" multiple></select>
            <select id="requirementValueSelect" multiple></select>
        </div>

        <select id="fetishBookSelect" multiple></select>
    </div>

    <div
        id="fetishList"
        class="fetish-list">
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<script
    type="module"
    src="js/pages/fetishes-page.js?v=1.0.5">
</script>

</body>
</html>
