<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="Garou Gifts">Garou Gifts</title>

    <!-- Choices.js -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"
    >

    <!-- Nasz CSS -->
    <link rel="stylesheet" href="css/main.css?v=1.0.3">
    <link rel="stylesheet" href="css/gifts.css?v=1.0.3">
</head>

<body>

<header class="site-header">

    <h1 id="appTitle" data-i18n="Garou Gifts">
        Garou Gifts
    </h1>

    <div class="top-bar">

        <div class="app-version">
            <span data-i18n="Version">Version</span>:
            <span data-app-version>v1.0.2</span>
        </div>

        <div class="language-switch">

            <label for="languageSelect">
                <span data-i18n="Language">Language</span>:
            </label>

            <select id="languageSelect">
                <option value="en" data-i18n="English">
                    English
                </option>

                <option value="pl" data-i18n="Polski">
                    Polski
                </option>
            </select>

        </div>

    </div>

    <nav class="main-nav">
        <a
            class="active"
            href="./index.html"
            aria-current="page"
            data-i18n="Gifts">
            Gifts
        </a>

        <a
            href="./fetishes.html"
            data-i18n="Fetishes and Talens">
            Fetishes and Talens
        </a>
    </nav>

</header>

<div class="tabs">

    <div class="tab active" data-i18n="Garou">Garou</div>

    <div class="tab">Bastet</div>

    <div class="tab">Corax</div>

    <div class="tab">Mokole</div>

</div>

<main id="garou-content">

    <div class="filters">

        <select id="rankSelect" multiple></select>

        <select id="breedSelect" multiple></select>

        <select id="auspiceSelect" multiple></select>

        <select id="tribeSelect" multiple></select>

        <select id="otherSelect" multiple></select>

    </div>

    <div
        id="giftList"
        class="gift-list">
    </div>

</main>

<div
    class="coming-soon"
    style="display:none;"
    data-i18n="Coming soon">

    Coming soon

</div>

<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<script
    type="module"
    src="js/pages/gifts-page.js?v=1.0.3">
</script>

</body>
</html>
